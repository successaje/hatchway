name: Release

# Publishes to npm when a maintainer pushes a version tag (vX.Y.Z). Nothing is published
# from branches or pull requests. Uses npm trusted publishing (OIDC): configure the
# repository as a trusted publisher for the `hatchway` package on npmjs.com; no long-lived
# npm token is stored in this repository.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - run: pnpm install --frozen-lockfile
      - name: Check the tag matches the package version
        run: |
          version=$(node -p "require('./packages/hatchway/package.json').version")
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != package v$version"; exit 1; }
      - run: pnpm lint && pnpm typecheck && pnpm build && pnpm test && pnpm test:integration
      - name: Pack
        run: pnpm --filter hatchway pack --pack-destination "$RUNNER_TEMP"
      - name: Publish with provenance
        run: npm install -g npm@latest && npm publish "$RUNNER_TEMP"/hatchway-*.tgz --provenance --access public
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk "/^## \\[${GITHUB_REF_NAME#v}\\]/{flag=1;next}/^## \\[/{flag=0}flag" CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/hatchway-*.tgz --title "$GITHUB_REF_NAME" --notes "$notes"
